name: Add app icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write icon files
        run: |
          echo '' | base64 -d > icons/icon-192.png
          echo '' | base64 -d > icons/icon-512.png
          echo '' | base64 -d > icons/icon-maskable-512.png
      - name: Commit icons
        run: |
          git config user.name "shubhamsinghx7-png"
          git config user.email "shubhamsinghx7-png@users.noreply.github.com"
          git add icons/
          git commit -m "Add app icons"
          git push
